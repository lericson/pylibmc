name: exp
on:
  push:
    branches: [scoped-sasl-path]
permissions:
  actions: read
  contents: read
jobs:
  old:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      - name: Download the wheels of the master dry run (old behaviour)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42865490261 -R "$GITHUB_REPOSITORY" -n wheels-ubuntu-latest -D wheels
      - name: Isolation check against the OLD wheel (expected to fail)
        run: .github/scripts/test-sasl-wheel.sh wheels || echo "exit status $? (expected nonzero)"
