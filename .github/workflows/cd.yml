name: CD
on:
  push:
    tags:
    - '*'
  # Dry run: builds everything but does not create a release.
  workflow_dispatch:

# Third-party actions are pinned to commit SHAs (version in the comment): the
# release job holds a token that can write to the repository.
permissions: {}

jobs:

  build_wheels:
    name: Build wheel for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      - name: Setup Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548  # v6.1.0
        with:
          python-version: 3.13

      - name: Set up QEMU
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0

      - name: Install cibuildwheel
        run: |
          python -m pip install cibuildwheel

      # TODO: replace this prebuilt binary tarball with a libmemcached built
      # from source in this job; it is fetched and unpacked with no checksum.
      - name: Install prebuilt Universal libraries for macOS
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          curl --output libs.tgz https://bsg.lericson.se/pylibmc_macos_libs.tar.gz
          tar -C /usr/local -xzmvf libs.tgz
          rm libs.tgz

      - name: Build wheels
        env:
          CIBW_SKIP: "*-musllinux* pp*"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          CIBW_BEFORE_BUILD_LINUX: "yum install -y libmemcached-devel"
          # We set DYLD_LIBRARY_PATH because of what appears to be a bug in
          # `delocate`, the program that bundles up the shared library
          # dependencies into the wheel file. The linker makes a link like
          # @rpath/libmemcached.11.dylib or similar, and delocate is unable to
          # resolve this @rpath macro into /usr/local/lib for some reason. It
          # would appear that delocate expects an LC_RPATH command to be listed
          # by `otool -l _pylibmc....so`, which it isn't. This does not seem to
          # be a problem for the DYLD system itself though, so again, likely a
          # bug in delocate. Fix by encouraging with DYLD_LIBRARY_PATH.
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: "env DYLD_LIBRARY_PATH=/usr/local/lib delocate-wheel --require-archs {delocate_archs} -w {dest_dir} {wheel}"
        run: |
          cibuildwheel --output-dir ./wheelhouse

      # Artifact names must be unique per job since upload-artifact v4.
      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      - name: Setup Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548  # v6.1.0
        with:
          python-version: '3.13'

      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: dist
          path: dist/*.tar.gz

  #upload_pypi:
  #  needs: [build_wheels, build_sdist]
  #  runs-on: ubuntu-latest
  #  steps:
  #    - uses: actions/download-artifact@v3
  #      with:
  #        name: artifact
  #        path: dist

  #    - uses: actions/download-artifact@v3
  #      with:
  #        name: wheels
  #        path: dist

  #    - name: Publish to PyPI
  #      uses: pypa/gh-action-pypi-publish@master
  #      with:
  #        user: ${{ secrets.PYPI_USERNAME }}
  #        password: ${{ secrets.PYPI_PASSWORD }}

  release:
    name: Create GitHub release
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs:
      - build_wheels
      - build_sdist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheels
      - name: Download sdist
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: dist
          path: dist
      - name: Make zip of artifacts
        run: |
          zip -0 artifacts.zip wheels/*.whl dist/*.tar.gz
      - name: Release on GitHub
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b  # v2.5.0
        with:
          files: |
            wheels/*.whl
            dist/*.tar.gz
            artifacts.zip
