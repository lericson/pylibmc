name: CD
on:
  push:
    tags:
    - '*'
  # Dry run: builds everything but does not create a release.
  workflow_dispatch:

# Third-party actions are pinned to commit SHAs (version in the comment): the
# release job holds a token that can write to the repository.
permissions: {}

jobs:

  # The version of the wheels and the sdist comes from src/pylibmc-version.h,
  # not from the tag, so a tag on a commit whose header says something else
  # would publish wheels under the wrong version. Fail before building them.
  check_version:
    name: Check the tag matches the version in the source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      - name: Compare
        env:
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^#define PYLIBMC_VERSION "\(.*\)"$/\1/p' src/pylibmc-version.h)
          echo "src/pylibmc-version.h says: ${version}"
          if [[ "${REF}" != refs/tags/* ]]; then
            echo "Not a tag build (dry run): nothing to compare."
          elif [[ -z "${version}" ]]; then
            echo "::error::Could not read PYLIBMC_VERSION from src/pylibmc-version.h"
            exit 1
          elif [[ "${TAG}" != "${version}" ]]; then
            echo "::error::Tag '${TAG}' does not match PYLIBMC_VERSION '${version}' in src/pylibmc-version.h. Tag a commit whose header says the version being released."
            exit 1
          else
            echo "Tag ${TAG} matches the source version."
          fi

  build_wheels:
    name: Build wheel for ${{ matrix.os }}
    needs: check_version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is split by architecture so that aarch64 builds and tests run
          # natively on an ARM runner. Under QEMU emulation they took about 17
          # of the 21 minutes the whole Linux job needed.
          - {os: ubuntu-latest, linux_archs: x86_64}
          - {os: ubuntu-24.04-arm, linux_archs: aarch64}
          - {os: macos-latest}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      - name: Setup Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548  # v6.1.0
        with:
          python-version: 3.13

      - name: Install cibuildwheel
        run: |
          python -m pip install cibuildwheel==3.3.1

      # libmemcached is built from a checksum-verified source tarball (see
      # .github/scripts/build-libmemcached.sh). The deployment target is kept
      # low on purpose: delocate refuses to bundle libraries whose minimum
      # macOS version is newer than the wheel's, so Homebrew bottles (built for
      # the runner's OS) would force wheels that only install on very recent
      # macOS. One universal build serves both wheel architectures.
      - name: Build universal libmemcached for macOS
        if: ${{ matrix.os == 'macos-latest' }}
        env:
          LIBMEMCACHED_VERSION: '1.1.4'
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          ARCHS: 'x86_64;arm64'
          SASL: 'on'
        run: |
          python -m pip install cmake
          PREFIX="$RUNNER_TEMP/libmemcached"
          .github/scripts/build-libmemcached.sh "$PREFIX"
          echo "LIBMEMCACHED_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          lipo -info "$PREFIX/lib/libmemcached.11.dylib"
          otool -l "$PREFIX/lib/libmemcached.11.dylib" | grep -A3 LC_BUILD_VERSION

      # The wheel tests need a memcached server. The Linux containers get it
      # from CIBW_BEFORE_TEST_LINUX below.
      - name: Install memcached for wheel tests (macOS)
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          command -v memcached || brew install memcached
          memcached --version

      - name: Build wheels
        env:
          # musllinux and free-threaded CPython (untested) are skipped. PyPy is
          # opt-in in cibuildwheel 3, which offers PyPy 3.11 only; CI tests
          # pypy3.11, so those wheels are covered. The wheel tests run on it too.
          CIBW_ENABLE: pypy
          # cp314t: free-threaded builds are not tested. cp38-macosx_arm64:
          # cibuildwheel cannot test it, so it would ship unverified.
          CIBW_SKIP: "*-musllinux* cp314t-* cp38-macosx_arm64"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_LINUX: ${{ matrix.linux_archs }}
          # manylinux_2_28 (AlmaLinux 8, glibc 2.28) is the cibuildwheel 3
          # default; manylinux2014 (CentOS 7) is end-of-life and its toolchain
          # is too old for libmemcached 1.1.4 (C++11, modern cmake/bison).
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux_2_28"
          # Runs once per architecture inside the container, with the
          # repository as the working directory.
          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y bison flex cyrus-sasl-devel &&
            pipx install cmake &&
            LIBMEMCACHED_VERSION=1.1.4 SASL=on JOBS=$(nproc)
            .github/scripts/build-libmemcached.sh /opt/libmemcached
          # Every wheel is installed into a fresh virtualenv and the test suite
          # is run against it from a temporary directory (never the source
          # tree). test-wheel.sh starts memcached, waits for it, and fails if
          # pylibmc was not imported from site-packages. Warnings from the
          # import-time libmemcached version check are errors.
          CIBW_TEST_REQUIRES: pytest
          # LD_LIBRARY_PATH (from CIBW_ENVIRONMENT_LINUX) is unset for the tests
          # so that they use the libmemcached bundled in the wheel rather than
          # the one in /opt/libmemcached.
          CIBW_TEST_COMMAND: >-
            env -u LD_LIBRARY_PATH
            bash {project}/.github/scripts/test-wheel.sh
            -W error::RuntimeWarning
            --doctest-modules --doctest-glob='*.txt'
            {project}/tests
          # AlmaLinux 8 ships memcached in AppStream. No nc there, so the
          # script falls back to bash's /dev/tcp.
          CIBW_BEFORE_TEST_LINUX: dnf install -y memcached
          # LD_LIBRARY_PATH lets auditwheel find (and bundle) libmemcached,
          # libhashkit and whatever else they need.
          CIBW_ENVIRONMENT_LINUX: >-
            LIBMEMCACHED=/opt/libmemcached
            LD_LIBRARY_PATH=/opt/libmemcached/lib:$LD_LIBRARY_PATH
          CIBW_ENVIRONMENT_MACOS: >-
            LIBMEMCACHED=$LIBMEMCACHED_PREFIX
            MACOSX_DEPLOYMENT_TARGET=11.0
          # We set DYLD_LIBRARY_PATH because of what appears to be a bug in
          # `delocate`, the program that bundles up the shared library
          # dependencies into the wheel file. The linker makes a link like
          # @rpath/libmemcached.11.dylib or similar, and delocate is unable to
          # resolve this @rpath macro into the libmemcached install prefix for
          # some reason. It would appear that delocate expects an LC_RPATH
          # command to be listed by `otool -l _pylibmc....so`, which it isn't.
          # This does not seem to be a problem for the DYLD system itself
          # though, so again, likely a bug in delocate. Fix by encouraging with
          # DYLD_LIBRARY_PATH.
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: "env DYLD_LIBRARY_PATH=$LIBMEMCACHED_PREFIX/lib delocate-wheel --require-archs {delocate_archs} -w {dest_dir} {wheel}"
        run: |
          cibuildwheel --output-dir ./wheelhouse

      # Artifact names must be unique per job since upload-artifact v4.
      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    needs: check_version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      - name: Setup Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548  # v6.1.0
        with:
          python-version: '3.13'

      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: dist
          path: dist/*.tar.gz

  #upload_pypi:
  #  needs: [build_wheels, build_sdist]
  #  runs-on: ubuntu-latest
  #  steps:
  #    - uses: actions/download-artifact@v3
  #      with:
  #        name: artifact
  #        path: dist

  #    - uses: actions/download-artifact@v3
  #      with:
  #        name: wheels
  #        path: dist

  #    - name: Publish to PyPI
  #      uses: pypa/gh-action-pypi-publish@master
  #      with:
  #        user: ${{ secrets.PYPI_USERNAME }}
  #        password: ${{ secrets.PYPI_PASSWORD }}

  release:
    name: Create GitHub release
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs:
      - build_wheels
      - build_sdist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheels
      - name: Download sdist
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: dist
          path: dist
      - name: Make zip of artifacts
        run: |
          zip -0 artifacts.zip wheels/*.whl dist/*.tar.gz
      - name: Detect pre-release tag
        id: prerelease
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ [0-9][.-]?(a|b|c|rc|alpha|beta|pre|preview|dev)[.-]?[0-9]* ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Release on GitHub
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b  # v2.5.0
        with:
          # Publishing is a deliberate manual step: review the draft, then
          # publish it. Tags like 1.7.0rc1, 1.7.0a2, 1.7.0b1, 1.7.0.dev0 are
          # flagged as pre-releases.
          draft: true
          prerelease: ${{ steps.prerelease.outputs.value }}
          files: |
            wheels/*.whl
            dist/*.tar.gz
            artifacts.zip
