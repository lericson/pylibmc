name: CI
on:
  # Pushes to pull request branches are covered by pull_request; running on
  # both ran every job twice per commit.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a PR supersedes the run in flight; never cancel master.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "pypy3.9", "pypy3.10", "pypy3.11"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    name: "${{ matrix.os }} Python: ${{ matrix.python-version }}"
    env:
      LIBMEMCACHED_VERSION: '1.0.18'
    services:
      memcached:
        image: memcached:1.6.45
        ports:
          - 11211:11211
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: ./.github/actions/setup-python-retry
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        pip install -r ./requirements_test.txt
        sudo apt-get update -qq
        sudo apt-get install libmemcached-dev
        apt-cache show libmemcached-dev
    - name: memcached stats
      run: echo "stats settings" | netcat localhost 11211 -w 3
    - name: Install package
      run: pip install .
    - name: Set LIBMEMCACHED_VERSION
      run: echo LIBMEMCACHED_VERSION="$(python -c 'import pylibmc; print(pylibmc.libmemcached_version)')" >> $GITHUB_ENV
    - name: Log versions
      run: |
        python --version
        pip --version
        echo "LIBMEMCACHED_VERSION=${LIBMEMCACHED_VERSION}"
    - name: Run test
      run: python bin/runtests.py -v tests --with-doctest
