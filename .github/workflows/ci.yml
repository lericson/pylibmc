name: CI
on:
  # Pushes to pull request branches are covered by pull_request; running on
  # both ran every job twice per commit.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a PR supersedes the run in flight; never cancel master.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changelog:
    # Every PR that touches src/, setup.py or .github/ adds a fragment to
    # changes.d/ (see changes.d/README.rst), or says "no-changelog" on a line
    # of its own in the description.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      with:
        # The merge commit and both its parents.
        fetch-depth: 2
    - name: Validate the fragments
      run: python3 bin/changelog check
    - name: Require a fragment for code changes
      env:
        # Passed through the environment, never expanded into the script.
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        if printf '%s\n' "$PR_BODY" | tr -d '\r' | grep -qxF no-changelog; then
          echo "no-changelog given; skipping"
          exit 0
        fi
        # HEAD is the merge of the PR into its base; HEAD^1 is the base.
        git diff --name-status HEAD^1 HEAD > /tmp/changes
        cat /tmp/changes
        if ! grep -qE '^\S+\s+(src/|setup\.py$|\.github/)' /tmp/changes; then
          echo "nothing under src/, setup.py or .github/ changed"
          exit 0
        fi
        if grep -qE '^A\s+changes\.d/.+\.rst$' /tmp/changes \
            && grep -E '^A\s+changes\.d/' /tmp/changes | grep -qv 'README.rst'; then
          exit 0
        fi
        echo "::error::Add a fragment to changes.d/ (see changes.d/README.rst), or put a line saying no-changelog in the PR description."
        exit 1

  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "pypy3.11"]
        # 1.0.18 is the legacy floor: Ubuntu 22.04 is the last runner image
        # whose libmemcached-dev package is 1.0.18 (24.04 ships 1.1.4). The
        # maintained 1.1.x series is built from source, on a subset of
        # Pythons (oldest, newest, one PyPy) to keep CI time sane.
        os: [ubuntu-22.04]
        libmemcached: ["1.0.18"]
        include:
          - {os: ubuntu-latest, python-version: "3.11", libmemcached: "1.1.4"}
          - {os: ubuntu-latest, python-version: "3.14", libmemcached: "1.1.4"}
          - {os: ubuntu-latest, python-version: "pypy3.11", libmemcached: "1.1.4"}
    runs-on: ${{ matrix.os }}
    name: "${{ matrix.os }} Python: ${{ matrix.python-version }} libmemcached: ${{ matrix.libmemcached }}"
    env:
      # Also read by .github/scripts/build-libmemcached.sh.
      LIBMEMCACHED_VERSION: ${{ matrix.libmemcached }}
    services:
      memcached:
        image: memcached:1.6.45
        ports:
          - 11211:11211
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: ./.github/actions/setup-python-retry
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        pip install -r ./requirements_test.txt
    - name: Install libmemcached ${{ matrix.libmemcached }} from apt
      if: ${{ matrix.libmemcached == '1.0.18' }}
      run: |
        sudo apt-get update -qq
        sudo apt-get install libmemcached-dev
        apt-cache show libmemcached-dev
    - name: Install libmemcached build dependencies
      if: ${{ matrix.libmemcached != '1.0.18' }}
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y bison flex libsasl2-dev
    - name: Cache libmemcached ${{ matrix.libmemcached }}
      if: ${{ matrix.libmemcached != '1.0.18' }}
      id: lmc-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/libmemcached
        key: libmemcached-${{ matrix.libmemcached }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/build-libmemcached.sh') }}
    - name: Build libmemcached ${{ matrix.libmemcached }} from source
      if: ${{ matrix.libmemcached != '1.0.18' && steps.lmc-cache.outputs.cache-hit != 'true' }}
      run: |
        SASL=on JOBS="$(nproc)" .github/scripts/build-libmemcached.sh "$HOME/libmemcached"
    - name: Point the build at the source-built libmemcached
      if: ${{ matrix.libmemcached != '1.0.18' }}
      run: |
        echo "LIBMEMCACHED=$HOME/libmemcached" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$HOME/libmemcached/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
    - name: memcached stats
      run: echo "stats settings" | netcat localhost 11211 -w 3
    - name: Install package
      run: pip install .
    - name: Set LIBMEMCACHED_VERSION
      run: echo LIBMEMCACHED_VERSION="$(python -c 'import pylibmc; print(pylibmc.libmemcached_version)')" >> $GITHUB_ENV
    - name: Check the expected libmemcached was used
      env:
        EXPECTED: ${{ matrix.libmemcached }}
      run: |
        echo "expected ${EXPECTED}, got ${LIBMEMCACHED_VERSION}"
        ldd "$(python -c 'import _pylibmc; print(_pylibmc.__file__)')" | grep memcached
        test "${LIBMEMCACHED_VERSION}" = "${EXPECTED}"
    - name: Log versions
      run: |
        python --version
        pip --version
        echo "LIBMEMCACHED_VERSION=${LIBMEMCACHED_VERSION}"
    - name: Run test
      run: python bin/runtests.py -v tests --with-doctest
    # The UDP and unix socket tests start their own memcached (the service
    # above has no UDP), so they need the binary; on 3.14 they must run.
    - name: Install memcached for the UDP and unix socket tests
      if: ${{ matrix.python-version == '3.14' }}
      run: sudo apt-get install -y -qq memcached
    - name: UDP and unix socket tests must run (libmemcached ${{ matrix.libmemcached }})
      if: ${{ matrix.python-version == '3.14' }}
      env:
        PYLIBMC_TEST_MEMCACHED_REQUIRED: "1"
      run: |
        python -m pytest tests/test_udp.py tests/test_unix_socket.py -v -rA | tee transports.log
        test "$(grep -c ' PASSED' transports.log)" -ge 20
        if grep -e SKIPPED -e ' FAILED' transports.log; then exit 1; fi
    # A real memcached that requires SASL, on its own port. Runs on the
    # newest Python of each libmemcached family (1.0.18 and 1.1.4), against
    # the package installed above.
    - name: Install a SASL memcached
      if: ${{ matrix.python-version == '3.14' }}
      run: |
        sudo apt-get install -y -qq memcached sasl2-bin libsasl2-modules netcat-openbsd
    - name: SASL login against a real server (libmemcached ${{ matrix.libmemcached }})
      if: ${{ matrix.python-version == '3.14' }}
      env:
        PYLIBMC_TEST_SASL_SERVER: 127.0.0.1:11311
        PYLIBMC_TEST_SASL_USER: testuser
        PYLIBMC_TEST_SASL_PASSWORD: secretpw
        PYLIBMC_TEST_SASL_REQUIRED: "1"
      run: |
        .github/scripts/sasl-server.sh start 11311 plain
        python -m pytest tests/test_sasl_login.py -v -rA | tee sasl-login.log
        .github/scripts/sasl-server.sh stop 11311
        # Prove the tests ran, rather than skipped.
        test "$(grep -c ' PASSED' sasl-login.log)" -ge 7
        # (a bare "! grep" would not trip errexit)
        if grep -e SKIPPED -e ' FAILED' sasl-login.log; then exit 1; fi
